name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  retrieval-eval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ragent
          POSTGRES_PASSWORD: ragent
          POSTGRES_DB: ragent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ragent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Cache embedding models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/fastembed
            ~/.cache/huggingface
          key: fastembed-${{ runner.os }}-${{ hashFiles('backend/requirements.txt') }}
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Run 20-question retrieval gate
        env:
          DATABASE_URL: postgresql://ragent:ragent@localhost:5432/ragent
          PYTHONPATH: backend
        run: python evaluation/regression.py
      - name: Checkpoint resume integration
        env:
          TEST_POSTGRES_URL: postgresql://ragent:ragent@localhost:5432/ragent
          PYTHONPATH: backend
        run: python -m pytest backend/tests/test_checkpoint_integration.py -q
      - name: Redis rate limit integration
        env:
          TEST_REDIS_URL: redis://localhost:6379/0
          PYTHONPATH: backend
        run: python -m pytest backend/tests/test_rate_limit_redis.py -q
